# =============================================================================
# Overlay for the horizontal-scaling demo (Section 14).
#
#   docker compose -f docker-compose.yml -f docker-compose.scale.yml \
#     up --build --scale agent=3
#
# Two containers cannot both own host port 8000, so the fixed "8000:8000"
# mapping in the base file has to go. A host RANGE lets Docker hand each
# replica its own port: 8000, 8001, 8002.
#
# Then prove the shared state:
#   curl localhost:8000/chat -d '{"message":"refund"}' -H 'content-type: application/json'
#   curl localhost:8001/chat -d '{"message":"refund"}' -H 'content-type: application/json'
#   curl localhost:8002/metrics      # counter is 2 - all three share one Redis
#
# Now set REDIS_URL to empty and repeat: each replica reports 1, because the
# InMemoryStore lives inside a single container. That is the whole argument for
# keeping application containers stateless.
# =============================================================================

services:
  agent:
    # `!override` REPLACES the base file's list instead of appending to it.
    # Without it Compose merges the two lists and you are still stuck on a
    # single 8000. Requires Compose v2.24+; on older versions, edit the base
    # file by hand instead of using this overlay.
    ports: !override
      - "8000-8002:8000"      # host range -> the same container port
