<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Support Agent</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f5f6f8; margin: 0; padding: 16px; }
    .card { max-width: 560px; margin: 40px auto; background: #fff; padding: 24px; border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,.08); }
    h1 { margin-top: 0; font-size: 22px; }
    textarea { width: 100%; box-sizing: border-box; height: 90px; padding: 10px; font: inherit;
               border: 1px solid #ccc; border-radius: 6px; }
    button { margin-top: 10px; padding: 10px 18px; font: inherit; border: 0; border-radius: 6px;
             background: #2563eb; color: #fff; cursor: pointer; }
    button:disabled { background: #93a5d6; }
    .examples button { background: #e5e7eb; color: #111; padding: 6px 10px; font-size: 13px; }
    #result { margin-top: 20px; }
    .tag { display: inline-block; padding: 2px 10px; border-radius: 12px; color: #fff; font-size: 13px; }
    .billing { background: #d97706; } .technical { background: #dc2626; } .general { background: #059669; }
    .error { color: #dc2626; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Support Agent</h1>
    <p>Type a message. The agent picks a category and writes a reply.</p>

    <div class="examples">
      <button onclick="useExample(this)">I was charged twice, please refund</button>
      <button onclick="useExample(this)">The app shows an error on login</button>
      <button onclick="useExample(this)">What are your hours?</button>
    </div>

    <textarea id="message" placeholder="Your message..."></textarea>
    <button id="send" onclick="sendTicket()">Send</button>

    <div id="result"></div>
  </div>

  <script>
    // Same server that serves this page. Change it if the API runs elsewhere.
    const API_URL = "/ticket";

    function useExample(btn) {
      document.getElementById("message").value = btn.textContent;
    }

    async function sendTicket() {
      const message = document.getElementById("message").value.trim();
      const result = document.getElementById("result");
      const send = document.getElementById("send");
      if (!message) return;

      send.disabled = true;
      result.textContent = "Thinking...";
      try {
        const res = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message }),
        });
        if (!res.ok) throw new Error("Server returned " + res.status);
        const data = await res.json();
        result.innerHTML = "";
        const tag = document.createElement("span");
        tag.className = "tag " + data.category;
        tag.textContent = data.category;
        const reply = document.createElement("p");
        reply.textContent = data.reply;
        result.append("Category: ", tag, reply);
        for (const [label, key] of [["Gemini", "gemini_reply"], ["Claude", "claude_reply"]]) {
          const p = document.createElement("p");
          const b = document.createElement("b");
          b.textContent = label + ": ";
          p.append(b, data[key]);
          result.append(p);
        }
      } catch (err) {
        result.innerHTML = '<p class="error"></p>';
        result.firstChild.textContent = "Error: " + err.message;
      } finally {
        send.disabled = false;
      }
    }
  </script>
</body>
</html>
